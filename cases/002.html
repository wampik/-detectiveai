:root{color-scheme:dark;--bg:#080f1e;--panel:#14213a;--edge:#354966;--gold:#e8b968;--txt:#e9edf6;--muted:#aebbd0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#243659,#080f1e 65%);color:var(--txt);font:16px/1.55 system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:2;background:#0b1425ed;border-bottom:1px solid var(--edge);padding:14px max(16px,calc((100vw - 900px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0;letter-spacing:1px;color:var(--gold)}small,.muted{color:var(--muted)}main{max-width:900px;margin:auto;padding:20px 15px 65px}.hero{padding:30px 20px;background:linear-gradient(140deg,#283147,#141d30);border:1px solid #5c5261;border-radius:18px;margin-bottom:15px}.hero h2{font-size:30px;margin:8px 0;color:#f4d19a}.tag{color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}button{background:#20304a;color:var(--txt);border:1px solid #51617b;border-radius:11px;padding:12px 10px;font:inherit;cursor:pointer}button:active{transform:scale(.99)}button.active,.gold{border-color:var(--gold);background:#453928;color:#fff2da}button:disabled{opacity:.4;cursor:not-allowed}.card{background:var(--panel);border:1px solid var(--edge);border-radius:15px;padding:17px;margin:12px 0}.card h3{margin:0 0 8px;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.grid .card{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:3px 8px;border:1px solid #596b84;border-radius:20px;font-size:12px;color:#c4d1e6;margin:3px 4px 3px 0}.done{color:#90d9b1}.locked{opacity:.55}input,textarea,select{width:100%;padding:12px;background:#0b1527;color:white;border:1px solid #52627d;border-radius:9px;font:inherit}textarea{min-height:95px}label{display:block;margin:10px 0 5px}.evidence{border-left:3px solid var(--gold);padding-left:12px}.photo{height:155px;background:linear-gradient(135deg,#1b3044,#393446);border:1px solid #59677a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:58px;margin-bottom:10px}.chat{background:#0c192e;border-radius:10px;padding:12px;margin:9px 0;border-left:3px solid #8199b7}.hint{background:#322c24;border:1px solid #7e6947;padding:12px;border-radius:9px;color:#f4dbad}.progress{height:7px;background:#263750;border-radius:20px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--gold);transition:width .2s}.status{font-size:13px;color:var(--muted)}@media(max-width:430px){nav{grid-template-columns:repeat(3,1fr)}button{font-size:14px}.hero h2{font-size:25px}}

</style></head><body><header><div><h1>◈ DETECTIVEAI</h1><small>Архив дел · Дело 002</small></div><button onclick="restart()">↻ Сначала</button></header><main><section class="hero"><div class="tag">Ленинградская область · 12 октября · 22:40</div><h2>Тень особняка</h2><p>В загородном доме «Сосновый мыс» найден мёртвым коллекционер Виктор Орлов. Четверо гостей утверждают, что во время отключения света не приближались к кабинету. Но один из них лжёт.</p><div class="status" id="progressText"></div><div class="progress"><div id="progressBar"></div></div></section><nav id="nav"></nav><section id="view"></section></main><script>
const KEY='detectiveai_case002_v3';const rooms=[{id:'office',name:'Кабинет',icon:'🕯️',desc:'Тело Орлова найдено у письменного стола. Окно заперто изнутри.',clues:['glass','clock','letter']},{id:'hall',name:'Холл',icon:'🕰️',desc:'Старинные часы, шкаф с ключами и вход в кабинет.',clues:['keylog','mud']},{id:'kitchen',name:'Кухня',icon:'🍵',desc:'Повар готовил чай к 22:00. На столе осталась книга заказов.',clues:['tea','receipt']},{id:'garden',name:'Сад',icon:'🌲',desc:'У боковой двери мокрая дорожка, хотя дождь закончился раньше.',clues:['boot','gate']},{id:'library',name:'Библиотека',icon:'📚',desc:'Здесь лежат документы коллекции и семейные фотографии.',clues:['contract','photo','ledger']}];
const clues={glass:{name:'Бокал у стола',text:'На бокале отпечатки Орлова и следы снотворного. По заключению эксперта, доза вызывала сонливость, но не смерть.'},clock:{name:'Разбитые часы',text:'Настенные часы остановились в 22:17, когда удар пришёлся по корпусу. Это не обязательно время смерти.'},letter:{name:'Порванная записка',text:'«В 22:10 верни оригинал. Иначе расскажу всем о подмене». Подпись отсутствует.'},keylog:{name:'Журнал ключей',text:'В 21:52 ключ от служебной двери кабинета взяла Марина. В 22:25 она отметила возврат.'},mud:{name:'След на ковре',text:'В холле след грязной обуви 42-го размера. Это может быть след любого, кто заходил с улицы.'},tea:{name:'Чайный поднос',text:'В 21:58 повар отдал поднос помощнице Марине. В 22:05 Орлову принесли чай.'},receipt:{name:'Книга заказов',text:'Запись: «22:00 — чай без сахара для В.О.» Сделана рукой повара Павла.'},boot:{name:'След у двери',text:'На садовой дорожке отпечаток каблука с треугольным сколом. Размер 39.'},gate:{name:'Датчик калитки',text:'Журнал показывает открытие боковой калитки в 22:14 и 22:21. Система работала от батареи.'},contract:{name:'Поддельный договор',text:'В папке обнаружена копия договора продажи картины. Номер холста не совпадает с номером в страховом реестре.'},photo:{name:'Фото с выставки',text:'На снимке двухмесячной давности Марина носит ботинки с треугольным сколом на каблуке.'},ledger:{name:'Страховой реестр',text:'Оригинал картины застрахован на крупную сумму. Последняя сверка проводилась Мариной месяц назад.'}};
const people=[{id:'marina',name:'Марина Соколова',role:'Помощница коллекционера',intro:'«Я принесла чай и сразу ушла в библиотеку. Во время отключения света я была там одна».',questions:[['Когда видели Орлова?','В 22:05, когда отдала чай. Он был раздражён.'],['Зачем брали ключ?','Для уборки. Я вернула его позже, как обычно.'],['Что делали в темноте?','Сидела в библиотеке. Я не выходила в сад.'],['Почему ваши ботинки на фото похожи на след?', 'Я часто хожу в сад. Но сегодня после ужина туда не выходила.','photo'],['Как объясните журнал калитки?', 'Наверное, датчик ошибся. Я его не трогала.','gate'],['Что знаете о подмене картины?', 'Я вела учёт коллекции, но не меняла картины.','contract']]},{id:'pavel',name:'Павел Громов',role:'Повар',intro:'«В 22:00 я убирал кухню. Потом отключили свет, и я искал свечи».',questions:[['Кто забрал поднос?','Марина. Я передал его около десяти.'],['Вы добавляли что-то в чай?','Нет. Чай заваривал я, но поднос унесла Марина.'],['Где были после 22:10?','На кухне. Свечи лежали в нижнем ящике.'],['Почему запись сделана заранее?', 'Заказы записываю перед подачей, это обычная практика.','receipt']]},{id:'igor',name:'Игорь Орлов',role:'Племянник погибшего',intro:'«Мы поссорились из-за наследства, но я ушёл в холл до десяти».',questions:[['Из-за чего был спор?','Дядя не хотел продавать дом. Я злился, но не убивал его.'],['Почему след в холле 42 размера?','У меня 42-й. Я выходил покурить ещё до ужина.'],['Где были при отключении света?','В холле, возле камина.'],['Знаете о договоре?', 'Впервые вижу. Я не занимался картинами.','contract']]},{id:'elena',name:'Елена Миронова',role:'Реставратор',intro:'«Весь вечер работала в библиотеке с каталогом. Орлова видела за ужином».',questions:[['Что вы делали в библиотеке?','Сравнивала каталоги. У меня остались пометки.'],['Кто приходил в библиотеку?','Марина заглянула примерно в 22:08 и почти сразу ушла.'],['Откуда знаете про подмену?','Номер холста в договоре выглядит неверным. Я хотела сказать Орлову утром.','contract'],['Вы видели Марину после 22:10?','Нет. В библиотеке её больше не было.','photo']] }];
const contradictions=[{id:'library',title:'Алиби Марины в библиотеке',needs:['photo'],people:['marina','elena'],desc:'Марина утверждает, что всё отключение света провела в библиотеке. Елена видела её лишь до 22:10.'},{id:'garden',title:'Отрицание выхода в сад',needs:['photo','boot','gate'],people:['marina'],desc:'Марина отрицает выход в сад, но след от характерного каблука и срабатывания калитки говорят об обратном.'},{id:'access',title:'Доступ к кабинету',needs:['keylog','tea'],people:['marina','pavel'],desc:'Марина имела ключ от служебной двери и лично принесла напиток Орлову.'},{id:'motive',title:'Мотив подмены',needs:['contract','ledger'],people:['marina'],desc:'Именно Марина вела учёт картин и могла скрывать замену оригинала.'}];
const initial=()=>({tab:'case',room:'office',found:[],asked:{},linked:[],notes:'',hints:0,finished:false,verdict:null});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=initial()}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const $=id=>document.getElementById(id);const has=id=>state.found.includes(id);const seen=(p,i)=>(state.asked[p]||[]).includes(i);const escaped=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(title,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${title}</button>`;
function nav(tab){state.tab=tab;save();render();window.scrollTo({top:0,behavior:"smooth"})}function findClue(id){if(!has(id))state.found.push(id);save();render()}function visit(id){state.room=id;save();render()}function ask(pid,i){if(!state.asked[pid])state.asked[pid]=[];if(!seen(pid,i))state.asked[pid].push(i);save();render()}function link(id){if(!state.linked.includes(id))state.linked.push(id);save();render()}function hint(){state.hints++;save();render()}function note(v){state.notes=v;save()}
function render(){const asked=Object.values(state.asked).reduce((n,a)=>n+a.length,0);$('progressText').textContent=`Улики: ${state.found.length}/12 · Допросы: ${asked} · Противоречия: ${state.linked.length}/4`;$('progressBar').style.width=Math.min(100,(state.found.length/12*55+state.linked.length/4*45))+'%';const tabs=[['case','⌂ Дело'],['rooms','⌕ Осмотр'],['people','☏ Допросы'],['evidence','▣ Улики'],['logic','◇ Связи'],['final','✓ Вердикт']];$('nav').innerHTML=tabs.map(([id,name])=>btn(name,`nav('${id}')`,state.tab===id?'active':'')).join('');let h='';if(state.tab==='case'){h=`<div class="card"><h3>Сводка дела</h3><p>Коллекционер Виктор Орлов найден мёртвым в кабинете около 22:40. Предварительная причина смерти — травма головы от тяжёлого предмета. Электричество в доме пропало с 22:12 до 22:23.</p><p>У следствия четыре фигуранта. Твоя задача — назвать убийцу, способ, мотив и ключевую улику. Нельзя полагаться на одну догадку: найди доказательства.</p><div class="hint">Начни с «Осмотр». Изученные улики появятся в отдельной вкладке. В «Связях» можно доказать противоречия.</div></div><div class="card"><h3>Блокнот детектива</h3><textarea placeholder="Запиши свои гипотезы..." oninput="note(this.value)">${escaped(state.notes)}</textarea></div><div class="card"><h3>Подсказки</h3><p class="muted">Можно пройти без подсказок. Каждая следующая раскрывает больше.</p>${btn('Получить подсказку', 'hint()')}${state.hints>0?`<p class="hint">${['Проверь, кто имел доступ к напитку и служебной двери.','Сопоставь показания Елены с алиби Марины.','След каблука, калитка и документы о картине связаны.'][Math.min(state.hints-1,2)]}</p>`:''}</div>`}
if(state.tab==='rooms'){const room=rooms.find(r=>r.id===state.room);h=`<div class="row">${rooms.map(r=>btn(r.icon+' '+r.name,`visit('${r.id}')`,state.room===r.id?'gold':'')).join('')}</div><div class="card"><div class="photo">${room.icon}</div><h3>${room.name}</h3><p>${room.desc}</p></div><div class="grid">${room.clues.map(id=>`<div class="card"><h3>${clues[id].name}</h3>${has(id)?`<p class="evidence">${clues[id].text}</p><span class="done">✓ Изучено</span>`:btn('Осмотреть',`findClue('${id}')`,'gold')}</div>`).join('')}</div>`}
if(state.tab==='people'){h=people.map(p=>`<div class="card"><h3>${p.name}</h3><small>${p.role}</small><div class="chat">${p.intro}</div>${p.questions.map(([q,a,req],i)=>`<div class="card ${req&&!has(req)?'locked':''}"><strong>${q}</strong>${req&&!has(req)?'<p class="muted">🔒 Найди связанную улику</p>':seen(p.id,i)?`<div class="chat">${a}</div>`:btn('Задать вопрос',`ask('${p.id}',${i})`)}</div>`).join('')}</div>`).join('')}
if(state.tab==='evidence'){h=`<h2>Собранные доказательства</h2><div class="grid">${Object.keys(clues).filter(has).map(id=>`<div class="card"><h3>${clues[id].name}</h3><p>${clues[id].text}</p></div>`).join('')||'<p>Пока улик нет. Начни осмотр комнат.</p>'}</div>`}
if(state.tab==='logic'){h=`<h2>Доска противоречий</h2><p class="muted">Для каждого вывода нужно найти необходимые улики и задать относящиеся к нему вопросы свидетелям.</p>${contradictions.map(c=>{const ready=c.needs.every(has)&&c.people.every(p=>Object.keys(state.asked).includes(p));return `<div class="card"><h3>${c.title}</h3><p>${c.desc}</p><small>Нужные улики: ${c.needs.map(id=>clues[id].name).join(', ')}</small><p>${state.linked.includes(c.id)?'<span class="done">✓ Противоречие доказано</span>':ready?btn('Закрепить вывод',`link('${c.id}')`,'gold'):'🔒 Изучи улики и поговори с нужными людьми'}</p></div>`}).join('')}`}
if(state.tab==='final'){if(state.finished){const good=state.verdict?.correct;h=`<div class="card"><h3>${good?'Дело раскрыто!':'Версия не доказана'}</h3><p>${good?'Ты установил, что Марина Соколова пыталась скрыть подмену картины. Она подсыпала снотворное в чай, затем вошла в кабинет через служебную дверь. Орлов очнулся и попытался её остановить; Марина ударила его бронзовой статуэткой и скрылась через сад.':'Твоя версия пока не совпадает с доказательствами. Проверь время событий, доступ к кабинету и мотив.'}</p><p>Ключевые факты: журнал ключей, чайный поднос, показания Елены, след каблука, датчик калитки и страховой реестр.</p>${btn('Пересмотреть дело', 'review()')}</div>`}else{h=`<div class="card"><h3>Финальный отчёт</h3><p>Укажи свою версию. После отправки получишь результат.</p><label>Кто виновен?</label><select id="who"><option value="">Выбери</option>${people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><label>Главный мотив</label><select id="why"><option value="">Выбери</option><option value="inheritance">Наследство</option><option value="painting">Скрыть подмену картины</option><option value="revenge">Месть</option><option value="money">Украсть деньги</option></select><label>Как преступник получил доступ?</label><select id="how"><option value="">Выбери</option><option value="window">Через окно</option><option value="service">Через служебную дверь</option><option value="front">Через главный вход</option></select><label>Основная улика</label><select id="proof"><option value="">Выбери</option><option value="clock">Разбитые часы</option><option value="keylog">Журнал ключей</option><option value="mud">Грязь в холле</option><option value="receipt">Книга заказов</option></select><p class="muted">Чтобы вынести обоснованный вердикт, закрепи хотя бы три противоречия.</p>${btn('Отправить отчёт','submitVerdict()','gold')}</div>`}}
$('view').innerHTML=h}
function submitVerdict(){if(state.linked.length<3){alert('Сначала докажи минимум три противоречия на вкладке «Связи».');return}const who=$('who').value,why=$('why').value,how=$('how').value,proof=$('proof').value;if(!who||!why||!how||!proof){alert('Заполни все поля отчёта.');return}state.verdict={who,why,how,proof,correct:who==='marina'&&why==='painting'&&how==='service'&&proof==='keylog'};state.finished=true;save();render()}
function review(){state.finished=false;save();render()}function restart(){if(confirm('Начать расследование заново? Весь прогресс будет удалён.')){state=initial();save();render()}}render();
</script><style id="detective-tools-style">
#detective-tools{position:fixed;right:12px;bottom:14px;z-index:900;display:flex;gap:8px;align-items:center}#detective-tools button{background:#e7bd79!important;color:#142035!important;border:1px solid #d6a95d!important;border-radius:25px!important;padding:11px 14px!important;box-shadow:0 4px 20px #0009!important;font-size:14px!important;font-weight:800!important}#detective-overlay{position:fixed;inset:0;z-index:1000;background:#050c16ba;display:none;align-items:flex-end;justify-content:center}#detective-overlay.open{display:flex}#detective-sheet{width:min(100%,650px);max-height:88dvh;overflow:auto;background:#132238;color:#edf3ff;border:1px solid #65738c;border-radius:18px 18px 0 0;padding:20px;box-shadow:0 0 40px #000a;font:15px/1.5 system-ui,sans-serif}#detective-sheet h2{font-size:22px;margin:0 0 12px;color:#f3c783}#detective-sheet p{color:#c7d2e3}#detective-sheet textarea{display:block;width:100%;min-height:210px;padding:12px;color:white;background:#0a1525;border:1px solid #667891;border-radius:10px;font:16px/1.5 system-ui,sans-serif;resize:vertical}#detective-sheet select{width:100%;padding:12px;background:#0a1525;color:white;border:1px solid #667891;border-radius:9px;font-size:16px}#detective-sheet button{margin:8px 6px 8px 0;padding:10px 13px;border-radius:10px;background:#d8ad69;color:#142035;font-weight:700}#detective-sheet .subtext{font-size:13px;color:#aab9d0}#detective-sheet .tools-row{display:flex;justify-content:space-between;align-items:center;gap:12px}#detective-tools-note{font-size:12px;color:#b9edc7;min-height:18px}body{padding-bottom:64px}
</style><script id="detective-tools-script">
(function(){
const ui=document.createElement('div');ui.innerHTML=`<div id="detective-tools"><button id="open-detective-notes" type="button">📝 Блокнот</button></div><div id="detective-overlay" role="dialog" aria-modal="true" aria-label="Инструменты детектива"><div id="detective-sheet"><div class="tools-row"><h2 id="detective-sheet-title">Блокнот детектива</h2><button id="close-detective-tools" type="button">✕</button></div><div id="detective-sheet-content"></div></div></div>`;
document.body.appendChild(ui);const $t=id=>document.getElementById(id);
const overlay=$t('detective-overlay'),content=$t('detective-sheet-content');
function persistNotes(){const area=$t('detective-quick-notes');if(!area)return;state.notes=area.value;save();const msg=$t('detective-tools-note');if(msg)msg.textContent='✓ Автоматически сохранено';}
let noteTimer;
function showNotes(){
 $t('detective-sheet-title').textContent='📝 Блокнот детектива';
 content.innerHTML=`<p>Записывай версии, алиби, время событий и подозрения. Блокнот доступен во время осмотра, допросов и в самом деле.</p><textarea id="detective-quick-notes" placeholder="Моя версия...\nПодозреваемые...\nЧто нужно проверить..."></textarea><div id="detective-tools-note" aria-live="polite">Заметки сохраняются автоматически</div><div class="tools-row"><button type="button" id="detective-save-notes">Сохранить</button><button type="button" id="detective-guide">💡 Направление поиска</button></div><div id="detective-guide-text" class="subtext"></div>`;
 $t('detective-quick-notes').value=state.notes||'';
 $t('detective-quick-notes').addEventListener('input',()=>{clearTimeout(noteTimer);noteTimer=setTimeout(persistNotes,300)});
 $t('detective-save-notes').onclick=persistNotes;
 $t('detective-guide').onclick=()=>{const e=$t('detective-guide-text');const found=state.found?.length||0;const asked=Array.isArray(state.asked)?state.asked.length:Object.values(state.asked||{}).flat().length;e.textContent=found<3?'Начни с осмотра нескольких помещений. Обращай внимание на время и доступ к закрытым зонам.':asked<2?'Улик уже достаточно для первых вопросов. Сопоставь показания свидетелей с найденными предметами.':'Проверь противоречия на вкладке «Связи», а затем собери аргументы для вердикта.';};
 overlay.classList.add('open');$t('detective-quick-notes').focus();
}
$t('open-detective-notes').onclick=showNotes;$t('close-detective-tools').onclick=()=>{persistNotes();overlay.classList.remove('open')};overlay.addEventListener('click',e=>{if(e.target===overlay){persistNotes();overlay.classList.remove('open')}});


})();
</script></body></html>
